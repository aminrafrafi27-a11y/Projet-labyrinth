<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Projet labyrinth
</title>
<style>
body {
    margin: 0;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}
h1 {
    margin-top: 30px;
    font-size: 2rem;
}
canvas {
    background: #fff;
    margin-top: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    border: 2px solid #444;
}
button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #4a90e2;
    color: white;
    cursor: pointer;
    font-size: 1rem;
}
</style>
</head>
<body>

<h1>Projet labyrinth
</h1>

<canvas id="maze" width="500" height="500"></canvas>

<br>
<button onclick="restart()">Restart</button>
<p id="msg"></p>

<script>
const canvas = document.getElementById("maze");
const ctx = canvas.getContext("2d");

const cols = 15;
const rows = 15;
const cellSize = canvas.width / cols;

let grid = [];

// Cellule basique
class Cell {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.walls = [true, true, true, true]; // top, right, bottom, left
        this.visited = false;
    }

    draw() {
        const px = this.x * cellSize;
        const py = this.y * cellSize;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;

        if (this.walls[0]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.stroke(); }
        if (this.walls[1]) { ctx.beginPath(); ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.stroke(); }
        if (this.walls[2]) { ctx.beginPath(); ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.stroke(); }
        if (this.walls[3]) { ctx.beginPath(); ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.stroke(); }
    }
}

function init() {
    grid = [];
    for (let y = 0; y < rows; y++) {
        let row = [];
        for (let x = 0; x < cols; x++) {
            row.push(new Cell(x, y));
        }
        grid.push(row);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    grid.forEach(row => row.forEach(cell => cell.draw()));
}

function restart() {
    init();
    draw();
    document.getElementById("msg").textContent = "";
}

restart();
</script>
</body>
</html>
