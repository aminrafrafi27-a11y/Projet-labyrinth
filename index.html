<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Projet labyrinth</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    font-family: Arial;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
}

canvas {
    background: #fff;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0072ff;
}

#info {
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Projet labyrinth</h1>

<div id="info">
⏱ Temps: <span id="time">0</span>s |
🏆 Best: <span id="best">--</span>
</div>

<canvas id="maze" width="500" height="500"></canvas>

<br>
<button onclick="restart()">🔄 Restart</button>

<p id="msg"></p>

<script>
const canvas = document.getElementById("maze");
const ctx = canvas.getContext("2d");

const cols = 15;
const rows = 15;
const cellSize = canvas.width / cols;

let grid = [];
let stack = [];

let player, exit;
let time = 0;
let timer;

// Cell structure
class Cell {
    constructor(x, y){
        this.x = x;
        this.y = y;
        this.walls = [true, true, true, true]; // top right bottom left
        this.visited = false;
    }

    draw(){
        const x = this.x * cellSize;
        const y = this.y * cellSize;

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;

        if(this.walls[0]) drawLine(x, y, x+cellSize, y);
        if(this.walls[1]) drawLine(x+cellSize, y, x+cellSize, y+cellSize);
        if(this.walls[2]) drawLine(x+cellSize, y+cellSize, x, y+cellSize);
        if(this.walls[3]) drawLine(x, y+cellSize, x, y);
    }
}

function drawLine(x1,y1,x2,y2){
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
}

// Initialize grid
function init(){
    grid = [];
    for(let y=0;y<rows;y++){
        let row=[];
        for(let x=0;x<cols;x++){
            row.push(new Cell(x,y));
        }
        grid.push(row);
    }
}

// DFS generation
function generateMaze(){
    let current = grid[0][0];
    current.visited = true;

    stack = [];

    while(true){
        let next = getNeighbor(current);

        if(next){
            next.visited = true;
            stack.push(current);
            removeWalls(current, next);
            current = next;
        } else if(stack.length > 0){
            current = stack.pop();
        } else break;
    }
}

function getNeighbor(cell){
    let neighbors = [];

    let {x,y} = cell;

    if(y>0 && !grid[y-1][x].visited) neighbors.push(grid[y-1][x]);
    if(x<cols-1 && !grid[y][x+1].visited) neighbors.push(grid[y][x+1]);
    if(y<rows-1 && !grid[y+1][x].visited) neighbors.push(grid[y+1][x]);
    if(x>0 && !grid[y][x-1].visited) neighbors.push(grid[y][x-1]);

    if(neighbors.length===0) return undefined;

    return neighbors[Math.floor(Math.random()*neighbors.length)];
}

function removeWalls(a,b){
    let dx = a.x - b.x;
    let dy = a.y - b.y;

    if(dx===1){
        a.walls[3]=false;
        b.walls[1]=false;
    }
    else if(dx===-1){
        a.walls[1]=false;
        b.walls[3]=false;
    }

    if(dy===1){
        a.walls[0]=false;
        b.walls[2]=false;
    }
    else if(dy===-1){
        a.walls[2]=false;
        b.walls[0]=false;
    }
}

// Draw everything
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    grid.forEach(row=>{
        row.forEach(cell=>{
            cell.draw();
        });
    });

    // exit
    ctx.fillStyle="green";
    ctx.fillRect(exit.x*cellSize+10, exit.y*cellSize+10, cellSize-20, cellSize-20);

    // player
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(
        player.x*cellSize + cellSize/2,
        player.y*cellSize + cellSize/2,
        cellSize/4,
        0, Math.PI*2
    );
    ctx.fill();
}

// Movement logic
function move(dx,dy){
    let cell = grid[player.y][player.x];

    if(dx===0 && dy===-1 && !cell.walls[0]) player.y--;
    if(dx===1 && dy===0 && !cell.walls[1]) player.x++;
    if(dx===0 && dy===1 && !cell.walls[2]) player.y++;
    if(dx===-1 && dy===0 && !cell.walls[3]) player.x--;

    draw();
    checkWin();
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") move(0,-1);
    if(e.key==="ArrowDown") move(0,1);
    if(e.key==="ArrowLeft") move(-1,0);
    if(e.key==="ArrowRight") move(1,0);
});

function checkWin(){
    if(player.x===exit.x && player.y===exit.y){
        clearInterval(timer);
        document.getElementById("msg").innerHTML="🎉 GAGNÉ !";

        let best=localStorage.getItem("best");
        if(!best || time<best){
            localStorage.setItem("best",time);
            document.getElementById("best").textContent=time+"s";
        }
    }
}

function startTimer(){
    timer=setInterval(()=>{
        time++;
        document.getElementById("time").textContent=time;
    },1000);
}

function restart(){
    init();
    generateMaze();

    player={x:0,y:0};
    exit={x:cols-1,y:rows-1};

    time=0;
    document.getElementById("msg").innerHTML="";
    clearInterval(timer);
    startTimer();
    draw();
}

function loadBest(){
    let best=localStorage.getItem("best");
    if(best) document.getElementById("best").textContent=best+"s";
}

loadBest();
restart();
</script>

</body>
</html>
